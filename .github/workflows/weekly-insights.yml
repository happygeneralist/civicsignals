name: Weekly insights

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. This runs on Friday afternoon UK time.
    # It is 16:00 in winter and 17:00 during British Summer Time.
    - cron: '0 16 * * 5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest feeds
        run: npm run ingest

      - name: Generate Gemini-enhanced weekly signals
        run: npm run signals:generate
        env:
          SIGNALS_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Change this only through a reviewed source change; do not follow a moving alias.
          GEMINI_MODEL: gemini-2.5-flash

      - name: Report signal generation outcome
        run: |
          diagnostics_path='src/data/signals/latest.json'
          provider_used=$(jq -r '.generation_diagnostics.provider_used' "$diagnostics_path")
          requested_provider=$(jq -r '.generation_diagnostics.requested_provider' "$diagnostics_path")
          status=$(jq -r '.generation_diagnostics.status' "$diagnostics_path")
          model=$(jq -r '.generation_diagnostics.model // "not applicable"' "$diagnostics_path")
          attempts=$(jq -r '.generation_diagnostics.attempts' "$diagnostics_path")
          category=$(jq -r '.generation_diagnostics.failure_category // "not applicable"' "$diagnostics_path")
          http_status=$(jq -r '.generation_diagnostics.http_status // "not applicable"' "$diagnostics_path")

          {
            echo '## Weekly signal generation'
            echo
            if [ "$provider_used" = 'gemini' ] && [ "$status" = 'succeeded' ]; then
              echo 'Gemini enhancement succeeded.'
            elif [ "$requested_provider" = 'rules' ]; then
              echo 'Rules provider was deliberately selected.'
            else
              echo 'Gemini enhancement failed and rules fallback was used.'
            fi
            echo
            echo "- Provider used: $provider_used"
            echo "- Model: $model"
            echo "- Attempts: $attempts"
            echo "- Failure category: $category"
            echo "- HTTP status: $http_status"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$provider_used" = 'rules_fallback' ]; then
            echo "::warning title=Gemini signal generation fallback::category=$category; http_status=$http_status; model=$model; attempts=$attempts"
          fi

      - name: Commit weekly signal data
        run: |
          if git diff --quiet -- src/data/signals; then
            echo "No weekly signal changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/signals
            git commit -m "Update weekly insights data"
            git push
          fi

      - name: Show generated status
        run: cat src/data/status.json

      - name: Build site
        run: npm run build

      - name: Upload GitHub Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
